<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1ed">
<title>MY NAIL STOCK</title>
<style>
:root {
  color-scheme: light dark;
  --site-primary: #9a625f;
  --site-on-primary: #ffffff;
  --site-secondary: #e9d5ce;
  --site-on-secondary: #503b38;
  --site-background: #f7f1ed;
  --site-on-background: #342b29;
  --site-font-body: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --site-font-heading: Georgia, "Times New Roman", serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  --surface: light-dark(#fffdfb,#262221);
  --surface-soft: light-dark(#f0e6e1,#342d2b);
  --text: light-dark(#342b29,#f2e9e5);
  --muted: light-dark(#887976,#b9a9a4);
  --line: light-dark(#e8dcd6,#4a3f3c);
  --shadow: 0 10px 30px rgba(73,45,39,.08);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--site-background); color: var(--text); font-family: var(--site-font-body); }
button,input,select,textarea { font: inherit; }
button { cursor: pointer; }
#app { min-height: 100vh; background-color: var(--site-background); color: var(--site-on-background); border-radius: 0; padding: calc(22px * var(--site-spacing-scale)) max(16px, env(safe-area-inset-right)) calc(34px * var(--site-spacing-scale)) max(16px, env(safe-area-inset-left)); }
.shell { width: min(100%, 760px); margin: 0 auto; }
.topline { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:26px; }
.brand { color:var(--site-primary); font: 600 13px var(--site-font-heading); letter-spacing:.22em; }
.topnote { color:var(--muted); font-size:11px; letter-spacing:.08em; }
.hero { padding: 6px 0 22px; }
.eyebrow { color:var(--site-primary); font-size:10px; letter-spacing:.2em; text-transform:uppercase; }
h1 { margin:8px 0 7px; font: 500 calc(34px * var(--site-heading-scale))/1.1 var(--site-font-heading); letter-spacing:.015em; color:var(--text); }
.subtitle { margin:0; color:var(--muted); font-size:12px; }
.toolbar { display:flex; gap:9px; margin:20px 0 15px; }
.search { flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:calc(14px * var(--site-radius-scale)); padding:12px 14px; color:var(--text); outline:none; }
.primary { border:0; border-radius:calc(14px * var(--site-radius-scale)); padding:0 17px; background:var(--site-primary); color:var(--site-on-primary); font-weight:600; font-size:13px; box-shadow:var(--shadow); }
#add { min-width:112px; min-height:48px; padding:0 22px; font-size:16px; border-radius:16px; }
.tabs { display:flex; gap:7px; padding:4px; border-radius:16px; background:var(--surface-soft); margin-bottom:14px; }
.tab { flex:1; border:0; border-radius:12px; padding:10px 6px; background:transparent; color:var(--muted); font-size:12px; }
.tab.active { background:var(--surface); color:var(--site-primary); box-shadow:0 2px 8px rgba(60,40,35,.07); font-weight:650; }
.filters { display:flex; gap:7px; overflow:auto; padding:1px 0 13px; scrollbar-width:none; }
.filters::-webkit-scrollbar { display:none; }
.color-filters { display:flex; gap:7px; overflow:auto; padding:0 0 13px; scrollbar-width:none; }
.color-filters::-webkit-scrollbar { display:none; }
.color-chip { white-space:nowrap; border:1px solid var(--line); border-radius:30px; padding:7px 12px; background:transparent; color:var(--muted); font-size:11px; }
.color-chip.active { background:var(--site-secondary); color:var(--site-on-secondary); border-color:var(--site-secondary); }
.chip { white-space:nowrap; border:1px solid var(--line); border-radius:30px; padding:7px 12px; background:transparent; color:var(--muted); font-size:11px; }
.chip.active { background:var(--site-secondary); color:var(--site-on-secondary); border-color:var(--site-secondary); }
.summary { display:flex; justify-content:space-between; align-items:center; margin:4px 1px 12px; color:var(--muted); font-size:11px; }
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px; }
.item { min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:var(--shadow); }
.item-body { padding:12px; }
.item-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px; }
.item-brand { color:var(--muted); font-size:10px; min-width:0; overflow-wrap:anywhere; }
.fav { flex:0 0 30px; width:30px; height:30px; border:0; border-radius:50%; background:var(--surface-soft); color:#a36b68; font-size:17px; }
.item-name { font-size:13px; font-weight:650; line-height:1.4; overflow-wrap:anywhere; }
.item-meta { margin-top:7px; display:flex; justify-content:space-between; align-items:center; gap:6px; color:var(--muted); font-size:10px; }
.tag { border-radius:30px; padding:4px 7px; background:var(--surface-soft); color:var(--site-primary); }
.empty { grid-column:1/-1; padding:42px 18px; text-align:center; border:1px dashed var(--line); border-radius:18px; color:var(--muted); font-size:13px; line-height:1.8; }
.footer-actions { display:flex; justify-content:center; gap:18px; padding:24px 0 5px; }
.text-btn { border:0; background:none; color:var(--muted); text-decoration:underline; text-underline-offset:3px; font-size:11px; }
.modal-backdrop { display:none; position:fixed; inset:0; z-index:5; background:rgba(25,18,16,.45); align-items:flex-end; justify-content:center; padding:12px; }
.modal-backdrop.show { display:flex; }
.modal { width:min(100%,560px); max-height:92vh; overflow:auto; background:var(--surface); color:var(--text); border-radius:22px; padding:21px; box-shadow:0 20px 70px rgba(0,0,0,.22); }
.modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:17px; }
.modal-head h2 { margin:0; font:500 23px var(--site-font-heading); }
.close { border:0; background:var(--surface-soft); color:var(--text); border-radius:50%; width:32px; height:32px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field.full { grid-column:1/-1; }
.field label { color:var(--muted); font-size:11px; }
.field input,.field select,.field textarea { width:100%; border:1px solid var(--line); border-radius:11px; padding:11px; background:var(--surface); color:var(--text); outline:none; }
.field textarea { min-height:70px; resize:vertical; }
.field input[type=color] { height:42px; padding:4px; }
.form-actions { display:flex; gap:9px; margin-top:17px; }
.form-actions button { min-height:43px; flex:1; border-radius:12px; }
.secondary { border:1px solid var(--line); background:transparent; color:var(--text); }
.danger { border:0; background:#f5e5e2; color:#8b3f39; }
.toast { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:9; background:#342b29; color:white; border-radius:30px; padding:10px 16px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.show { opacity:1; }
@media(min-width:600px) { #app { padding-top:34px; } .grid {gap:15px;} .item-body {padding:14px;} }
@media(max-width:360px) { .grid {gap:8px;} .primary {padding:0 12px;} #add { min-width:104px; min-height:48px; padding:0 16px; font-size:15px; } }
</style>
</head>
<body>
<main id="app"><div class="shell">
  <div class="topline"><div class="brand">MY NAIL STOCK</div><div class="topnote">MY LITTLE COLLECTION</div></div>
  <header class="hero"><div class="eyebrow">nail color archive</div><h1>My Nail Stock</h1><p class="subtitle">好きな色も、道具も。わたしのネイルコレクション。</p></header>
  <div class="toolbar"><input id="search" class="search" type="search" placeholder="名前・ブランド・色で検索"><button class="primary" id="add">＋ 追加</button></div>
  <nav class="tabs" aria-label="表示切替"><button class="tab active" data-tab="collection">コレクション</button><button class="tab" data-tab="wishlist">ほしいもの</button><button class="tab" data-tab="favorites">お気に入り</button></nav>
  <div class="filters" id="filters"></div>
  <div class="color-filters" id="colorFilters"></div>
  <div class="summary"><span id="count">0 items</span><span>YOUR NAIL COLLECTION</span></div>
  <section class="grid" id="items"></section>
  <div class="footer-actions"><button class="text-btn" id="export">データを書き出す</button><button class="text-btn" id="import">バックアップを読み込む</button><input type="file" id="file" accept="application/json" hidden></div>
</div></main>
<div class="modal-backdrop" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-head"><h2 id="modalTitle">アイテムを追加</h2><button class="close" id="close" aria-label="閉じる">×</button></div>
  <form id="itemForm"><div class="form-grid">
    <div class="field full"><label for="name">アイテム名 *</label><input id="name" required maxlength="80" placeholder="例：ジェリーブラウン"></div>
    <div class="field"><label for="brand">ブランド</label><input id="brand" maxlength="60" placeholder="例：Seria"></div>
    <div class="field"><label for="category">カテゴリ</label><select id="category"><option>カラージェル</option><option>ベース・トップ</option><option>パーツ</option><option>ツール</option><option>ケア用品</option></select></div>
    <div class="field"><label for="colorGroup">色系（大まかな分類）</label><select id="colorGroup"><option>未分類</option><option>レッド</option><option>ピンク</option><option>オレンジ</option><option>イエロー</option><option>グリーン</option><option>ブルー</option><option>パープル</option><option>ブラウン</option><option>ベージュ</option><option>ホワイト</option><option>グレー</option><option>ブラック</option><option>クリア</option><option>その他</option></select></div>
    <div class="field"><label for="finish">質感</label><select id="finish"><option value="">選択なし</option><option>マット</option><option>シアー</option><option>マグネット</option><option>ラメ・グリッター</option><option>ミラー</option><option>その他</option></select></div>
    <div class="field"><label for="status">ステータス</label><select id="status"><option value="owned">持っている</option><option value="wish">ほしいもの</option></select></div>
    <div class="field full"><label for="memo">メモ</label><textarea id="memo" maxlength="500" placeholder="使い心地や購入先など"></textarea></div>
  </div><div class="form-actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button type="submit" class="primary">保存する</button></div><div class="form-actions" id="deleteRow" hidden><button type="button" class="danger" id="delete">このアイテムを削除</button></div></form>
</section></div><div class="toast" id="toast"></div>
<script>
(() => {
 const KEY='my-nail-stock-v1';
 let items=[]; let tab='collection'; let category='すべて'; let colorGroup='すべて'; let editing=null;
 const $=id=>document.getElementById(id);
 try { items=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(items)) items=[]; } catch { items=[]; }
 const cats=['すべて','カラージェル','ベース・トップ','パーツ','ツール','ケア用品'];
 const colorGroups=['すべて','未分類','レッド','ピンク','オレンジ','イエロー','グリーン','ブルー','パープル','ブラウン','ベージュ','ホワイト','グレー','ブラック','クリア','その他'];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items));}catch{toast('保存できませんでした。バックアップを書き出してください。');}};
 function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2100);}
 function renderFilters(){ $('filters').innerHTML=cats.map(c=>`<button class="chip ${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join(''); }
 function renderColorFilters(){ $('colorFilters').innerHTML=colorGroups.map(c=>`<button class="color-chip ${c===colorGroup?'active':''}" data-color-group="${esc(c)}">${esc(c)}</button>`).join(''); }
 function render(){
  renderFilters(); renderColorFilters(); const q=$('search').value.trim().toLowerCase();
  let shown=items.filter(x=>{const match=[x.name,x.brand,x.memo,x.category,x.colorGroup].join(' ').toLowerCase().includes(q);const tabMatch=tab==='collection'?x.status==='owned':tab==='wishlist'?x.status==='wish':x.favorite;return match&&tabMatch&&(category==='すべて'||x.category===category)&&(colorGroup==='すべて'||(x.colorGroup||'未分類')===colorGroup);});
  $('count').textContent=`${shown.length} items`;
  $('items').innerHTML=shown.length?shown.map(x=>`<article class="item" data-id="${esc(x.id)}"><div class="item-body"><div class="item-head"><div class="item-brand">${esc(x.brand||x.category)}</div><button class="fav" data-fav="${esc(x.id)}" aria-label="お気に入り">${x.favorite?'♥':'♡'}</button></div><div class="item-name">${esc(x.name)}</div><div class="item-meta"><span>${esc(x.finish||'')}</span><span class="tag">${x.status==='wish'?'WISHLIST':esc(x.category)}</span></div></div></article>`).join(''):`<div class="empty">${tab==='wishlist'?'気になるアイテムを追加してみよう。':tab==='favorites'?'お気に入りはまだありません。':'最初のアイテムを登録してみよう。'}<br>「＋ 追加」から記録できます。</div>`;
 }
 function openForm(item){editing=item?.id||null;$('modalTitle').textContent=item?'アイテムを編集':'アイテムを追加';$('name').value=item?.name||item?.colorName||'';$('brand').value=item?.brand||'';$('category').value=item?.category||'カラージェル';$('colorGroup').value=item?.colorGroup||'未分類';$('finish').value=item?.finish||'';$('status').value=item?.status||'owned';$('memo').value=item?.memo||'';$('deleteRow').hidden=!item;$('backdrop').classList.add('show');$('name').focus();}
 function closeForm(){$('backdrop').classList.remove('show');editing=null;}
 $('add').onclick=()=>openForm();$('close').onclick=closeForm;$('cancel').onclick=closeForm;$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop'))closeForm();});
 $('itemForm').onsubmit=e=>{e.preventDefault();const old=items.find(x=>x.id===editing);const obj={id:editing||String(Date.now())+'-'+Math.random().toString(16).slice(2),name:$('name').value.trim(),brand:$('brand').value.trim(),category:$('category').value,colorGroup:$('colorGroup').value,finish:$('finish').value,status:$('status').value,memo:$('memo').value.trim(),favorite:old?.favorite||false};if(old)items=items.map(x=>x.id===editing?obj:x);else items.unshift(obj);save();closeForm();render();toast('保存しました');};
 $('delete').onclick=()=>{if(!editing)return;items=items.filter(x=>x.id!==editing);save();closeForm();render();toast('削除しました');};
 $('items').addEventListener('click',e=>{const fav=e.target.closest('[data-fav]');if(fav){const x=items.find(x=>x.id===fav.dataset.fav);if(x){x.favorite=!x.favorite;save();render();}return;}const card=e.target.closest('[data-id]');if(card)openForm(items.find(x=>x.id===card.dataset.id));});
 $('filters').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){category=b.dataset.cat;render();}});
 $('colorFilters').addEventListener('click',e=>{const b=e.target.closest('[data-color-group]');if(b){colorGroup=b.dataset.colorGroup;render();}});
 document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));category='すべて';colorGroup='すべて';render();});
 $('search').addEventListener('input',render);
 $('export').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-nail-stock-backup.json';a.click();URL.revokeObjectURL(a.href);};
 $('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error();items=data;save();render();toast('バックアップを読み込みました');}catch{toast('ファイルを読み込めませんでした');}e.target.value='';};
 render();
})();
</script>
</body>
</html>
